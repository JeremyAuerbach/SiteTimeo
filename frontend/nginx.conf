server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interne de Docker. Avec le nom du backend dans une variable, nginx le résout à chaque
    # requête au lieu d'une seule fois au démarrage : il démarre même si le backend n'est pas
    # encore là (il répond alors 502), et suit le backend s'il redémarre avec une autre adresse.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # L'API est servie sur la même origine que le site : les cookies de session suivent.
    location /api/ {
        # Au-delà de la limite du backend (2 Mo) pour que ce soit lui qui réponde, avec son message.
        client_max_body_size 3m;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
