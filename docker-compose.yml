name: site-timeo

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timeo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timeo}
      POSTGRES_DB: ${POSTGRES_DB:-timeo}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-timeo}:${POSTGRES_PASSWORD:-timeo}@db:5432/${POSTGRES_DB:-timeo}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Sans proxy : un proxy configuré dans Docker ne doit pas intercepter cet appel local.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.build_opener(u.ProxyHandler({})).open('http://localhost:8000/api/health')"
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
